name: test-install

on:
  schedule:
    # Every Tuesday at 03:00 UTC
    - cron: "0 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-install
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  casks-macos:
    name: Casks on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel covers Intel Macs.
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Speed up long installs with gtimeout
        run: brew install coreutils

      - name: Tap this repository
        run: |
          brew tap idealisan/extra-universe "$(pwd)"
          brew trust idealisan/extra-universe

      - name: Install every cask
        shell: bash
        run: bash .github/scripts/install-all.sh cask

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-results-casks-${{ matrix.runner }}
          path: install-results.txt
          if-no-files-found: warn

  formulas-linux:
    name: Formulas on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Cover both Linux architectures used by the formulae.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
        with:
          core: true
          cask: false
          test-bot: false

      - name: Tap this repository
        run: |
          brew tap idealisan/extra-universe "$(pwd)"
          brew trust idealisan/extra-universe

      - name: Install every formula
        shell: bash
        run: bash .github/scripts/install-all.sh formula

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-results-formulas-linux
          path: install-results.txt
          if-no-files-found: warn

  auto-bump:
    name: Auto-bump from GitHub releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump versions and checksums from GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/auto_bump.py

      - name: Commit package updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-bump packages from GitHub releases"
          file_pattern: Casks Formula
